services:
  rustfs:
    image: ${RUSTFS_IMAGE}
    depends_on:
      rustfs-volume-permissions:
        condition: service_completed_successfully
    expose:
      - "${RUSTFS_PORT}"
      - "${RUSTFS_CONSOLE_PORT}"
    volumes:
      - ${RUSTFS_DATA_DIR}:/data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: "0.0.0.0:${RUSTFS_PORT}"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:${RUSTFS_CONSOLE_PORT}"
      RUSTFS_CONSOLE_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${RUSTFS_PORT}/health/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks: [mlops]

  rustfs-volume-permissions:
    image: ${ALPINE_IMAGE}
    volumes:
      - ${RUSTFS_DATA_DIR}:/data
    command: >
      sh -c "
        chown -R 10001:10001 /data &&
        echo 'RustFS volume permissions fixed (10001:10001)' &&
        exit 0
      "
    restart: "no"
    networks: [mlops]

  rustfs-init:
    image: ${MC_IMAGE}
    depends_on:
      rustfs:
        condition: service_healthy
      rustfs-volume-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_PORT: ${RUSTFS_PORT}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      MLFLOW_ARTIFACT_BUCKET: ${MLFLOW_ARTIFACT_BUCKET}
      DVC_BUCKET: ${DVC_BUCKET}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        echo 'Waiting for RustFS S3 endpoint...'
        attempt=1
        max_attempts=15
        until mc alias set -- rustfs "http://rustfs:$${RUSTFS_PORT}" "$${RUSTFS_ACCESS_KEY}" "$${RUSTFS_SECRET_KEY}"; do
          if [ "$${attempt}" -ge "$${max_attempts}" ]; then
            echo "ERROR: RustFS alias setup failed after $${max_attempts} attempts." >&2
            exit 1
          fi
          attempt=$$((attempt + 1))
          sleep 2
        done
        mc mb --ignore-existing "rustfs/$${MLFLOW_ARTIFACT_BUCKET}"
        echo "Bucket ensured: $${MLFLOW_ARTIFACT_BUCKET}"
        mc mb --ignore-existing "rustfs/$${DVC_BUCKET}"
        echo "Bucket ensured: $${DVC_BUCKET}"
    restart: "no"
    networks: [mlops]
